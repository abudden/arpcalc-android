plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing details are kept outside the repository (see build_command.sh).
// Without keystore.properties, debug builds and tests still work.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def haveKeystore = keystorePropertiesFile.exists()
if (haveKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// The version comes from the repository's latest tag (e.g. v1.4.0), as for
// the desktop version: app/changeset.py works it out (and writes
// RevisionInfo.kt) and prints the versionName and versionCode.
def versionLines = providers.exec {
    workingDir = rootProject.file('app')
    commandLine 'python3', 'changeset.py'
}.standardOutput.asText.get().readLines()
def appVersionName = versionLines[0]
def appVersionCode = versionLines[1].toInteger()

android {
    namespace = 'uk.co.cgtk.karpcalc'
    compileSdk = 36

    defaultConfig {
        applicationId = "uk.co.cgtk.karpcalc"
        minSdk = 25
        targetSdk = 36
        versionCode = appVersionCode
        versionName = appVersionName
    }

    lint {
        abortOnError = false
    }

    compileOptions {
        // Conversion.kt uses java.time, which needs desugaring below API 26
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        if (haveKeystore) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../proguard-rules.pro'
            if (haveKeystore) {
                signingConfig = signingConfigs.release
            }
        }
    }

    sourceSets {
        main.manifest.srcFile '../src/androidUi/AndroidManifest.xml'
        main.res.srcDirs = ['../src/androidUi/res']
        main.java.srcDirs += '../src/main'
        main.java.srcDirs += '../src/androidUi/kotlin'
        test.java.srcDirs += '../src/test'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'ch.obermuhlner:big-math:1.2.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Required for local unit tests (JUnit 4 framework)
    testImplementation 'junit:junit:4.13.2'
    // For OptionsLayoutTest: lays the options pages out as on a phone
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:core:1.7.0'
}

tasks.withType(Test).configureEach {
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}
